name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives package versions from tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check plugin skill copy is in sync
        run: diff -r .agents/skills/stove-dotnet plugins/stove-dotnet/skills/stove-dotnet

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test --project tests/StoveDotnet.UnitTests -c Release --no-build

      - name: Integration tests
        run: dotnet test --project tests/StoveDotnet.IntegrationTests -c Release --no-build

      - name: Example e2e tests
        run: dotnet test --project examples/OrderService.E2ETests.XunitV3 -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Package smoke test
        run: bash scripts/package-smoke-test.sh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
