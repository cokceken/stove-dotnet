name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-suites.yml

  packages:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # MinVer derives package versions from tags

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Check plugin skill copy is in sync
        run: diff -r .agents/skills/stove-dotnet plugins/stove-dotnet/skills/stove-dotnet

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Verify release package manifest
        shell: pwsh
        run: ./scripts/verify-package-manifest.ps1 -ArtifactsDirectory artifacts

      - name: Package smoke test
        run: bash scripts/package-smoke-test.sh artifacts

      - name: Verify frameworks against isolated NuGet packages
        shell: pwsh
        run: ./scripts/verify-framework-examples.ps1 -UsePackages -ResultsDirectory artifacts/framework-packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: framework-package-verification
          path: artifacts/framework-packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
