name: test suites

on:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Core
            project: tests/StoveDotnet.UnitTests
          - suite: Hosting
            project: tests/StoveDotnet.Hosting.AcceptanceTests
          - suite: PostgreSQL
            project: tests/StoveDotnet.Postgres.AcceptanceTests
          - suite: SQL Server
            project: tests/StoveDotnet.SqlServer.AcceptanceTests
          - suite: MongoDB
            project: tests/StoveDotnet.MongoDb.AcceptanceTests
          - suite: MySQL
            project: tests/StoveDotnet.MySql.AcceptanceTests
          - suite: Redis
            project: tests/StoveDotnet.Redis.AcceptanceTests
          - suite: RabbitMQ
            project: tests/StoveDotnet.RabbitMq.AcceptanceTests
          - suite: Kafka
            project: tests/StoveDotnet.Kafka.AcceptanceTests
          - suite: OrderService composition
            project: examples/Frameworks/OrderService.E2ETests.XunitV3
          - suite: API and worker composition
            project: examples/MultiApplication/Tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build suite and its dependencies
        run: dotnet build "${{ matrix.project }}" -c Release
      - name: Run suite
        run: dotnet test --project "${{ matrix.project }}" -c Release --no-build

  frameworks:
    name: Framework / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [Xunit, NUnit, MSTest, TUnit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify framework examples and runner outcomes
        shell: pwsh
        run: |
          ./scripts/tests/framework-output.Tests.ps1
          ./scripts/verify-framework-examples.ps1 -Framework ${{ matrix.framework }} -ResultsDirectory artifacts/framework-tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: framework-${{ matrix.framework }}
          path: artifacts/framework-tests
