name: release

# Publishes to nuget.org when a version tag is pushed, e.g.:
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# The package version comes from the tag (MinVer). Tags with a pre-release suffix create a GitHub pre-release.
#
# The nuget.org Trusted Publishing policy must match repository cokceken/stove-dotnet, workflow release.yml,
# and environment nuget.org. The GitHub environment restricts deployments to v* tags and requires approval.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test-suites.yml
    with:
      # The tag must be on main, where CI ran the Windows and macOS suites for this commit. Waiting for a macOS
      # runner again only delays the release; the packages are built and verified on Linux.
      cross-platform: false

  prepare:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in origin/main."
            exit 1
          fi

      # A version on nuget.org can never be replaced or removed, so a mistyped tag is rejected before anything is built.
      - name: Verify release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Release tag '$tag' must start with 'v'." }
          ./scripts/tests/release-version.Tests.ps1
          ./scripts/verify-release-version.ps1 -Version $tag.Substring(1)

      # Curated notes are optional for pre-releases and required for stable versions.
      - name: Collect release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "release-notes/$tag.md"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if (Test-Path -LiteralPath $notes) {
            Copy-Item -LiteralPath $notes -Destination artifacts/release-notes.md
            Write-Host "Using $notes."
          } elseif ($tag -notmatch '-') {
            throw "Stable release $tag needs curated release notes in $notes."
          } else {
            Write-Host "No $notes; the pre-release gets generated notes only."
          }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Verify release package manifest
        shell: pwsh
        run: ./scripts/verify-package-manifest.ps1 -ArtifactsDirectory artifacts -Version ($env:GITHUB_REF_NAME).TrimStart('v')

      # Packages pin each other to exact versions; dependencies are pushed first so a partial release stays restorable.
      - name: Determine package push order
        shell: pwsh
        run: |
          ./scripts/get-package-push-order.ps1 -ArtifactsDirectory artifacts |
            ForEach-Object { Split-Path $_ -Leaf } |
            Set-Content -LiteralPath artifacts/push-order.txt
          Get-Content -LiteralPath artifacts/push-order.txt

      - name: Package smoke test
        run: bash scripts/package-smoke-test.sh artifacts

      - name: Verify frameworks against isolated NuGet packages
        shell: pwsh
        run: ./scripts/verify-framework-examples.ps1 -UsePackages -ResultsDirectory artifacts/framework-packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: framework-package-verification
          path: artifacts/framework-packages

      - name: Upload verified release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/push-order.txt
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    environment:
      name: nuget.org
      url: https://www.nuget.org/profiles/${{ vars.NUGET_USER }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages
          path: artifacts

      # Signed statement that these exact files were built by this workflow run from this commit. Verify a file
      # from the GitHub release with: gh attestation verify <file> --repo cokceken/stove-dotnet
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          notes=""
          if [ -f artifacts/release-notes.md ]; then notes="--notes-file artifacts/release-notes.md"; fi
          # Curated notes, when present, come first; the generated list of changes follows them.
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes $notes $prerelease

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # One package at a time, dependencies first. The matching symbol package next to each file is pushed with it.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
          listed=$(grep -c . artifacts/push-order.txt)
          if [ "$packages" -ne "$listed" ]; then
            echo "push-order.txt lists $listed packages but $packages were downloaded."
            exit 1
          fi
          while IFS= read -r name; do
            if [ ! -f "artifacts/$name" ]; then echo "Listed package $name is missing."; exit 1; fi
            dotnet nuget push "artifacts/$name" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done < artifacts/push-order.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
