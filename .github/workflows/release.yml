name: release

# Publishes to nuget.org when a version tag is pushed, e.g.:
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# The package version comes from the tag (MinVer). Tags with a pre-release suffix create a GitHub pre-release.
#
# The nuget.org Trusted Publishing policy must match repository cokceken/stove-dotnet, workflow release.yml,
# and environment nuget.org. The GitHub environment restricts deployments to v* tags and requires approval.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test-suites.yml

  prepare:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in origin/main."
            exit 1
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Verify release package manifest
        shell: pwsh
        run: ./scripts/verify-package-manifest.ps1 -ArtifactsDirectory artifacts -Version ($env:GITHUB_REF_NAME).TrimStart('v')

      - name: Package smoke test
        run: bash scripts/package-smoke-test.sh artifacts

      - name: Verify frameworks against isolated NuGet packages
        shell: pwsh
        run: ./scripts/verify-framework-examples.ps1 -UsePackages -ResultsDirectory artifacts/framework-packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: framework-package-verification
          path: artifacts/framework-packages

      - name: Upload verified release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: nuget.org
      url: https://www.nuget.org/profiles/${{ vars.NUGET_USER }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: artifacts

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes $prerelease

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
